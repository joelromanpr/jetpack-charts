name: Feature proposal
description: Discuss a chart family, API improvement, or integration need.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe what the app's user needs to understand or do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an API sketch or visual example if useful, and explain how existing charts fall short.
    validations:
      required: true
