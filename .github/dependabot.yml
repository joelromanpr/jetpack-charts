version: 2
updates:
  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: monthly
    groups:
      documentation:
        patterns: ['*']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major'] # Upgrade with Astro checker support.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      android-toolchain:
        patterns: ['com.android*', 'org.jetbrains.kotlin*']
      compose:
        patterns: ['androidx.compose*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
