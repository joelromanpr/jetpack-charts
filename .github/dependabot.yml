version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      android-toolchain:
        patterns: ['com.android*', 'org.jetbrains.kotlin*']
      compose:
        patterns: ['androidx.compose*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
