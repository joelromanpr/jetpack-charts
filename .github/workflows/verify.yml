name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./scripts/check-surfaces.sh
      - run: >-
          ./gradlew :charts-core:test :charts-compose:testDebugUnitTest
          :charts-compose:lintRelease :sample:lintDebug :sample:assembleDebug apiCheck
          :charts-core:generatePomFileForMavenPublication :charts-compose:generatePomFileForMavenPublication
      - run: python3 scripts/check-poms.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-reports
          path: '**/build/reports/'

  device:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [23, 36, 37]
        include:
          - api: 37
            sdk: '37.2'
            target: google_apis_ps16k
            profile: pixel_7
            ram: 4096M
            options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics -verbose -logcat '*:e'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Reserve emulator disk space
        run: |
          du -sh /usr/share/dotnet
          sudo rm -rf /usr/share/dotnet
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.sdk || matrix.api }}
          target: ${{ matrix.target || 'google_apis' }}
          profile: ${{ matrix.profile || '' }}
          ram-size: ${{ matrix.ram || '' }}
          emulator-options: ${{ matrix.options || '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim' }}
          arch: x86_64
          disk-size: 2048M
          disable-animations: true
          script: ./gradlew :charts-compose:connectedDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            charts-compose/build/reports/androidTests/
            charts-compose/build/outputs/androidTest-results/
